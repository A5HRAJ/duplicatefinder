# Runs the release gate (test/check.sh) on every push, pull request and
# release tag. The script is the single source of truth for what "green"
# means; this file only provides it with a toolchain.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, unit tests, headless suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run the release gate
        run: test/check.sh
